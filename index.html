<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profes · SportClub Corrientes</title>
<style>
  :root { --fondo:#f4f5f7; --tarjeta:#fff; --texto:#1b1f24; --suave:#5f6b7a; --borde:#d9dee5; --acento:#e30613; --ok:#1e8e3e; --mal:#c5221f; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#111418; --tarjeta:#1b2027; --texto:#eef1f5; --suave:#9aa6b4; --borde:#2d3540; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fondo); color:var(--texto); }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; } .sub { color: var(--suave); font-size: 14px; margin-bottom: 14px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display:block; font-size: 14px; color: var(--suave); margin: 10px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input { display: block; width: 100%; max-width: 100%; min-width: 0; font-size: 17px; padding: 12px; border-radius: 10px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); }
  /* iPhone: el campo de hora tiene un ancho propio que se sale de la tarjeta */
  input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 48px; line-height: 1.2; text-align: left; }
  input[type="time"]::-webkit-date-and-time-value { text-align: left; }
  .dos { display:flex; gap: 8px; } .dos button { flex:1; }
  button { font-size: 17px; padding: 13px; border-radius: 10px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); }
  button.elegido { background: var(--texto); color: var(--tarjeta); border-color: var(--texto); }
  button.principal { width:100%; background: var(--acento); color:#fff; border:0; font-weight: 600; margin-top: 4px; }
  button:disabled { opacity: .5; }
  video, img#vista { width: 100%; border-radius: 10px; background:#000; display:block; aspect-ratio: 3/4; object-fit: cover; }
  .estado { font-size: 14px; margin-top: 8px; color: var(--suave); } .estado.ok { color: var(--ok); } .estado.mal { color: var(--mal); }
  .oculto { display:none !important; }
  #final { text-align:center; padding: 30px 14px; } #final .grande { font-size: 44px; }
</style>
</head>
<body>
<main>
  <h1>Registro de clase</h1>
  <div class="sub">SportClub Corrientes · completalo al empezar cada clase</div>

  <div id="formulario">
    <div class="tarjeta">
      <label>¿Estás reemplazando a alguien?</label>
      <div class="dos"><button type="button" id="reemNo">No</button><button type="button" id="reemSi">Sí</button></div>
    </div>

    <div id="bloqueTitular" class="tarjeta oculto">
      <label for="profe">Profe</label>
      <select id="profe"><option value="">Cargando…</option></select>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="4 números">
    </div>

    <div id="bloqueReemplazo" class="tarjeta oculto">
      <label for="nombreReemplazo">Tu nombre y apellido</label>
      <input id="nombreReemplazo" type="text" autocomplete="name" placeholder="Nombre y apellido">
      <label for="reemplazaA">¿A quién reemplazás?</label>
      <select id="reemplazaA"></select>
    </div>

    <div id="bloqueResto" class="oculto">
    <div class="tarjeta">
      <label for="clase">Clase</label>
      <select id="clase"><option value="">Cargando…</option></select>
      <label for="horario">Horario de la clase</label>
      <input id="horario" type="time">
    </div>

    <div class="tarjeta">
      <label>Foto con el gimnasio de fondo</label>
      <video id="video" autoplay playsinline muted class="oculto"></video>
      <img id="vista" class="oculto" alt="Foto sacada">
      <canvas id="lienzo" class="oculto"></canvas>
      <div class="dos" style="margin-top:8px">
        <button type="button" id="sacar" class="oculto">📸 Sacar foto</button>
        <button type="button" id="repetir" class="oculto">Repetir</button>
      </div>
      <button type="button" id="reintentarCamara" class="oculto" style="width:100%;margin-top:8px">Volver a intentar con la cámara</button>
      <div id="estadoCamara" class="estado">Abriendo la cámara…</div>
    </div>

    <div class="tarjeta">
      <div id="estadoUbicacion" class="estado">Buscando tu ubicación…</div>
    </div>

    <button type="button" id="enviar" class="principal" disabled>Enviar registro</button>
    <div id="estadoEnvio" class="estado"></div>
    </div>
  </div>

  <div id="final" class="tarjeta oculto">
    <div class="grande">✓</div>
    <h1>¡Listo!</h1>
    <div id="detalleFinal" class="sub"></div>
    <button type="button" id="otro">Registrar otra clase</button>
  </div>
</main>

<script>
// Si la página se abre desde GitHub, ENDPOINT es la dirección del robot. Servida por Google, queda vacía.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbywEJS0cCgtoggcsz6Q-2tGyPigOwQsc3p2vloK8kp8huBb1eq2_mMrFrxXBqkQFXO0/exec';
const $ = (id) => document.getElementById(id);
const estado = { reemplazo: '', foto: '', lat: '', lng: '', precision: '', stream: null };

function guardar(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) {} }
function leer(clave) { try { return localStorage.getItem(clave); } catch (e) { return null; } }

function llamar(accion, datos) {
  if (!ENDPOINT && window.google && google.script && google.script.run) {
    return new Promise((ok, mal) => {
      const r = google.script.run.withSuccessHandler(ok).withFailureHandler(mal);
      if (accion === 'config') r.configParaPaginaProfes(); else r.registrarProfe(datos);
    });
  }
  if (accion === 'config') return fetch(ENDPOINT + '?accion=config').then((r) => r.json());
  return fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(datos) }).then((r) => r.json());
}

function llenar(select, items, vacio) {
  select.innerHTML = '<option value="">' + vacio + '</option>' + items.map((x) => '<option>' + x.replace(/</g, '&lt;') + '</option>').join('');
}

function mostrarConfig(c) {
  llenar($('profe'), c.profes || [], 'Elegí tu nombre');
  llenar($('reemplazaA'), c.profes || [], 'Elegí a quién');
  llenar($('clase'), c.clases || [], 'Elegí la clase');
  const ultimo = leer('profe');
  if (ultimo && (c.profes || []).indexOf(ultimo) >= 0) $('profe').value = ultimo;
}

function cargarConfig() {
  const cache = leer('config');
  if (cache) { try { mostrarConfig(JSON.parse(cache)); } catch (e) {} }
  llamar('config').then((c) => { guardar('config', JSON.stringify(c)); const p = $('profe').value, cl = $('clase').value;
    mostrarConfig(c); if (p) $('profe').value = p; if (cl) $('clase').value = cl; })
    .catch(() => { if (!cache) $('estadoEnvio').textContent = 'No se pudo cargar la lista. Revisá la conexión.'; });
}

// ---- Cámara en vivo: la foto se saca en el momento. No hay opción de elegir una foto guardada.
function abrirCamara() {
  if (estado.stream) estado.stream.getTracks().forEach((t) => t.stop());
  $('reintentarCamara').classList.add('oculto');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return sinCamara();
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false })   // solo cámara de selfie
    .then((s) => { estado.stream = s; $('video').srcObject = s; $('video').classList.remove('oculto'); $('vista').classList.add('oculto');
      $('sacar').classList.remove('oculto'); $('repetir').classList.add('oculto');
      $('estadoCamara').textContent = 'Encuadrá tu cara con el gimnasio de fondo y tocá “Sacar foto”.'; $('estadoCamara').className = 'estado'; })
    .catch(() => sinCamara());
}

function sinCamara() {
  $('reintentarCamara').classList.remove('oculto');
  $('estadoCamara').innerHTML = 'No se pudo abrir la cámara. Abrí este link en <b>Chrome</b> (Android) o <b>Safari</b> (iPhone), no desde WhatsApp, y tocá <b>Permitir</b> cuando te pida la cámara.';
  $('estadoCamara').className = 'estado mal';
}
$('reintentarCamara').onclick = abrirCamara;

function comprimir(fuente, ancho, alto) {
  const max = 1024, escala = Math.min(1, max / Math.max(ancho, alto));
  const c = $('lienzo'); c.width = Math.round(ancho * escala); c.height = Math.round(alto * escala);
  c.getContext('2d').drawImage(fuente, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.7);
}

function fotoLista(dataUrl) {
  estado.foto = dataUrl; $('vista').src = dataUrl; $('vista').classList.remove('oculto'); $('video').classList.add('oculto');
  $('sacar').classList.add('oculto'); $('repetir').classList.remove('oculto');
  $('estadoCamara').textContent = 'Foto lista ✓'; $('estadoCamara').className = 'estado ok';
  if (estado.stream) { estado.stream.getTracks().forEach((t) => t.stop()); estado.stream = null; }
  revisar();
}

$('sacar').onclick = () => { const v = $('video'); fotoLista(comprimir(v, v.videoWidth, v.videoHeight)); };
$('repetir').onclick = () => { estado.foto = ''; revisar(); abrirCamara(); };

// ---- Ubicación
function buscarUbicacion() {
  if (!navigator.geolocation) { $('estadoUbicacion').textContent = 'Este teléfono no da la ubicación.'; return; }
  navigator.geolocation.getCurrentPosition((p) => {
    estado.lat = p.coords.latitude; estado.lng = p.coords.longitude; estado.precision = Math.round(p.coords.accuracy);
    $('estadoUbicacion').textContent = 'Ubicación lista ✓ (±' + estado.precision + ' m)'; $('estadoUbicacion').className = 'estado ok'; revisar();
  }, () => { $('estadoUbicacion').textContent = 'Activá la ubicación del teléfono y permitila para esta página.'; $('estadoUbicacion').className = 'estado mal'; revisar(); },
  { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

// ---- Formulario
function elegirReemplazo(v) { estado.reemplazo = v; $('reemSi').classList.toggle('elegido', v === 'Sí'); $('reemNo').classList.toggle('elegido', v === 'No');
  $('bloqueReemplazo').classList.toggle('oculto', v !== 'Sí'); $('bloqueTitular').classList.toggle('oculto', v !== 'No');
  $('bloqueResto').classList.remove('oculto'); revisar(); }
$('reemSi').onclick = () => elegirReemplazo('Sí');
$('reemNo').onclick = () => elegirReemplazo('No');
['profe', 'pin', 'clase', 'horario', 'reemplazaA', 'nombreReemplazo'].forEach((id) => { $(id).oninput = revisar; $(id).onchange = revisar; });

function revisar() {
  const quien = estado.reemplazo === 'No' ? $('profe').value && $('pin').value.length >= 4
    : estado.reemplazo === 'Sí' && $('nombreReemplazo').value.trim().length >= 3 && $('reemplazaA').value;
  const listo = quien && $('clase').value && estado.foto;
  $('enviar').disabled = !listo;
}

$('enviar').onclick = () => {
  $('enviar').disabled = true; $('estadoEnvio').textContent = 'Enviando…'; $('estadoEnvio').className = 'estado';
  const titular = estado.reemplazo === 'No';
  if (titular) guardar('profe', $('profe').value);
  llamar('registrar', { profe: titular ? $('profe').value : $('nombreReemplazo').value.trim(), pin: titular ? $('pin').value : '',
    reemplazo: estado.reemplazo, reemplazaA: titular ? '' : $('reemplazaA').value,
    clase: $('clase').value, horario: $('horario').value, lat: estado.lat, lng: estado.lng, precision: estado.precision,
    foto: estado.foto, dispositivo: navigator.userAgent.slice(0, 120) })
    .then((r) => {
      if (!r || !r.ok) { $('estadoEnvio').textContent = (r && r.error) || 'No se pudo enviar.'; $('estadoEnvio').className = 'estado mal'; revisar(); return; }
      $('formulario').classList.add('oculto'); $('final').classList.remove('oculto');
      $('detalleFinal').textContent = 'Registrado a las ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) +
        (r.distancia != null ? ' · a ' + r.distancia + ' m del gimnasio' : '') + (r.estado && r.estado !== 'OK' ? ' · ' + r.estado : '');
    })
    .catch(() => { $('estadoEnvio').textContent = 'Sin conexión. Probá de nuevo.'; $('estadoEnvio').className = 'estado mal'; revisar(); });
};

$('otro').onclick = () => location.reload();

elegirReemplazo('No');   // por defecto: no es reemplazo
cargarConfig();
abrirCamara();
buscarUbicacion();
</script>
</body>
</html>
